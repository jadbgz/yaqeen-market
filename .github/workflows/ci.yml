name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: Database — migrations, RLS and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
      - run: supabase db start
      - run: supabase test db --local
      - run: supabase db lint --local --level warning --fail-on error

  web:
    name: Web — lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  mobile:
    name: Mobile — lint, types and export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx expo customize tsconfig.json
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist-ci-web
      - run: npx expo export --platform android --output-dir dist-ci-android
      - run: npx expo export --platform ios --output-dir dist-ci-ios
