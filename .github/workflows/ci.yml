name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: Database — migrations, RLS and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
      - run: supabase db start
      - run: supabase test db --local
      - run: supabase db lint --local --level warning --fail-on error

  web:
    name: Web — lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the web staging release contract
        env:
          YAQEEN_ENVIRONMENT: staging
          YAQEEN_RELEASE_SHA: 0123456789abcdef0123456789abcdef01234567
          YAQEEN_HEALTHCHECK_TOKEN: ci_health_token_0123456789abcdef0123456789abcdef
          NEXT_PUBLIC_SITE_URL: https://ci-staging.yaqeen.example
          NEXT_PUBLIC_SUPABASE_URL: https://ci-staging.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_staging_contract
          SUPABASE_SERVICE_ROLE_KEY: sb_service_role_ci_staging_contract_0123456789
          STRIPE_TEST_CHECKOUT_ENABLED: "true"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_staging_contract_012345
          STRIPE_SECRET_KEY: sk_test_ci_staging_contract_012345
          STRIPE_WEBHOOK_SECRET: whsec_ci_staging_contract_012345
        run: npm run release:check:web
      - name: Verify production remains locked
        env:
          YAQEEN_ENVIRONMENT: production
        run: if npm run release:check:web; then exit 1; fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Web — critical user journeys
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://ci.yaqeen.example
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    name: Mobile — lint, types and export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run doctor
      - name: Resolve preview native configuration
        env:
          APP_VARIANT: preview
        run: npx expo config --type public
      - name: Resolve production native configuration
        env:
          APP_VARIANT: production
        run: npx expo config --type public
      - name: Verify preview release gate
        env:
          APP_VARIANT: preview
          EXPO_PUBLIC_SUPABASE_URL: https://ci-preview.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_not_a_credential
          EXPO_PUBLIC_SITE_URL: https://ci-preview.yaqeen.example
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_only_not_a_credential
        run: npm run release:check
      - name: Verify production remains locked
        env:
          APP_VARIANT: production
        run: if npm run release:check; then exit 1; fi
      - run: npx expo export --platform web --output-dir dist-ci-web
      - run: npx expo export --platform android --output-dir dist-ci-android
      - run: npx expo export --platform ios --output-dir dist-ci-ios
