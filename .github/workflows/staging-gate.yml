name: Staging release gate

on:
  workflow_dispatch:

concurrency:
  group: staging-release-gate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Staging — release identity, dependencies and checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      YAQEEN_ENVIRONMENT: staging
      YAQEEN_RELEASE_SHA: ${{ github.sha }}
      YAQEEN_HEALTHCHECK_TOKEN: ${{ secrets.STAGING_HEALTHCHECK_TOKEN }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.STAGING_BASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_TEST_CHECKOUT_ENABLED: "true"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.STAGING_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
      PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      STAGING_HEALTH_TOKEN: ${{ secrets.STAGING_HEALTHCHECK_TOKEN }}
      EXPECTED_RELEASE_SHA: ${{ github.sha }}
      YAQEEN_STAGING_SMOKE: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the staging configuration contract
        run: npm run release:check:web
      - run: npx playwright install --with-deps chromium
      - name: Verify the deployed staging release
        run: npm run test:e2e:staging
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: staging-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
